database {
  jdbcUrl = "jdbc:rqlite:http://localhost:4001"
  jdbcUrl = ${?DB_URL}
}

server {
  host = "0.0.0.0"
  host = ${?SERVER_HOST}
  port = 8080
  port = ${?SERVER_PORT}
  # Dev mode: serve static assets from filesystem
  # In production, a reverse proxy (nginx) serves static files
  dev-mode = true
  dev-mode = ${?SERVER_DEV_MODE}
  # Enable dev API endpoints (e.g. /api/dev/reset-phase)
  dev-endpoints = true
  dev-endpoints = ${?SERVER_DEV_ENDPOINTS}
}

location {
  slug = ""
  slug = ${?LOCATION_SLUG}
}

provision {
  dir = ""
  dir = ${?PROVISION_DIR}
}

shared {
  dir = ""
  dir = ${?SHARED_DIR}
}

unifi {
  proxy-url = ""
  proxy-url = ${?UNIFI_PROXY_URL}
}

# Which of the redirect's signals make two sessions the same device: ByFingerprint, ByMac or
# ByMacAndFingerprint. Empty means ByMacAndFingerprint.
device {
  matching = ""
  matching = ${?DEVICE_MATCHING}
}

# Where the location's bundle publishes manifest.json, which client error reports are checked
# against. Empty: reports are judged without it.
bundle {
  manifest-url = ""
  manifest-url = ${?BUNDLE_MANIFEST_URL}
}

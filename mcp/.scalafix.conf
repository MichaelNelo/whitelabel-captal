# The root .scalafix.conf, minus the two things scalafix refuses to do on Scala 3.10.
#
# Both rules gate on the same predicate and both reject this module:
#
#   "OrganizeImports.removeUnused" is not supported on 3.10.0 as the compiler is not providing
#   enough information. Please upgrade the Scala compiler to 3.3.4 or greater.
#   You must use a more recent version of the Scala 3 compiler (3.3.4+)
#
# 3.10.0 is greater than 3.3.4, so this is scalafix comparing versions and losing on the two-digit
# minor, not a real gap in what the compiler emits. Same shape as the other 3.10 casualties here;
# see `mcp`'s scalaVersion in build.mill.
#
# The loss is only the autofix: `-Wunused:imports,locals,explicits,implicits` is on, so an unused
# import is still reported on every compile — it just has to be deleted by hand. Grouping and
# sorting, which is most of what this config is for, keep working.
#
# Delete this file when scalafix parses 3.10, and the module inherits the root config again.
rules = [
  OrganizeImports
]

OrganizeImports {
  groupedImports = Merge
  groups = [
    "re:javax?\\."
    "scala."
    "*"
  ]
  removeUnused = false
  targetDialect = Scala3
}
